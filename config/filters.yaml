# ============================================================
# EDIT ME before the first real run — these are placeholders.
# ============================================================
# roles: a title matches when the role's words appear in order with at
#   most one word between them ("Software Engineer" matches "Senior
#   Software Development Engineer" but not "Software QA Tools Engineer").
#   "ML"/"AI" also match the spelled-out forms. Add a role per phrasing
#   you care about (e.g. "Backend Developer" is NOT implied by
#   "Backend Engineer").
# locations: case-insensitive whole-word match against the job's location
# experience: max years; enforced against title AND description
#   (seniority words, "Engineer III"/"SDE 4" levels, "N+ years" mentions)

roles:
  - Software Engineer
  - Backend Engineer
  - AI Engineer
  - ML Engineer
  - Data Scientist

locations:
  - India
  - Bengaluru
  - Bangalore
  - Hyderabad

# When true, jobs tagged "Remote" also pass regardless of city (this used to
# be baked into `locations` above, which let remote-US/EU postings leak in).
include_remote: true

experience: 0-2 years

# Only match postings from within this many days. Based on each ATS's own
# posted/updated date; falls through (keeps the job) if that date can't be
# parsed, rather than silently dropping it.
max_days_old: 7

# Optional LLM-written intro on the daily digest (needs OPENROUTER_API_KEY).
ai_digest: false
